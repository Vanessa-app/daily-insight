/* V1.4: evidence-first bilingual reader */

.card-art.has-photo:after{display:none}.card-art{height:160px}.reader-cover{height:300px;border-radius:16px;background:linear-gradient(120deg,#b6c8bb,#d8b99d);margin:20px 0;overflow:hidden}.quiz-panel{background:#fffdf8;border:1px solid #e2ded4;border-radius:16px;padding:24px;margin:30px 0}.quiz-panel h3{font-size:24px}.quiz-question{border:0;border-top:1px solid #e4e1d9;padding:18px 0;margin:0}.quiz-question legend{font-weight:700;line-height:1.7;padding-top:12px}.quiz-choice{display:block;border:1px solid #dddcd5;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer;line-height:1.6}.quiz-choice:has(input:checked){border-color:#294b40;background:#eff5ef}.quiz-feedback{background:#edf4e9;padding:18px;border-radius:12px;line-height:1.8;margin-top:18px}.badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.badge-card{background:#fffdf8;border:1px solid #e2ded4;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:8px}.badge-card strong{font-size:17px}.badge-card small{color:#69756c}.badge-card.locked{opacity:.5}@media(max-width:600px){.badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reader-cover{height:190px}}

.site-toolbar {
 position: sticky;
 top: 0;
 z-index: 10;
 background: #f8f6f0;
 padding-top: env(safe-area-inset-top, 0px);
}
.site-toolbar #explore-toolbar>p.meta{margin:0 0 16px}
#explore-toolbar .explore-topics{flex-wrap:nowrap}
#explore-toolbar .filter{flex:none}
@media(max-width:600px){nav{flex-wrap:wrap;gap:0 16px}.tab{padding:12px 2px}}

.article-prose{margin:24px 0}
.article-prose>.reader-text{margin:0 0 1em}

@media(max-width:800px){
 .site-toolbar nav{flex-wrap:nowrap;gap:0 16px}
 .site-toolbar nav .tab{flex:none;padding:12px 2px}
 #explore-toolbar .sectionhead{margin:12px 0 4px}
 #explore-toolbar .sectionhead h2{font-size:23px}
 .site-toolbar #explore-toolbar>p.meta{margin:0 0 8px}
 #explore-toolbar .explore-topics{padding-bottom:8px}
}

/* Let each image set the frame height so the entire composition is visible. */
.article-visual .card-art,.article-visual .reader-cover{height:auto;background:none}
.article-visual .card-art:after{display:none}
.article-visual .reader-cover{margin:16px auto 8px;max-width:720px}
.topic-art[hidden]{display:none}
.topic-art{color:var(--art-ink)}
.illustration-frame{background:var(--art-bg)}
.illustration-frame.has-generated svg{display:none}
.illustration-frame svg,.illustration-frame img,.official-photo,.official-photo img{display:block;width:100%;height:auto}
.official-photo:focus-visible{outline:3px solid #286452;outline-offset:-4px}
.visual-label{display:block;padding:3px 8px;background:#f8f6f0;color:#536159;text-align:right;font-size:11px;line-height:1.4}
.photo-credit{max-width:720px;margin:0 auto 12px}

#explore-toolbar:has(.reader-back){max-width:830px;margin-inline:auto}
.reader-back{display:block;min-height:44px;padding:8px 10px;margin-left:-10px;font-size:15px;font-weight:700}
.reader{margin-top:20px}

.reader-aside-inner {
 border: 1px solid #e2e1d9;
 border-radius: 12px;
 background: #f4f2ea;
 padding: 18px;
}
.reader-aside-inner > h2, .reader-panel-header h2 {
 font-size: 16px;
 margin: 0 0 12px;
}
.reader-float-button { display: none; }
.reader-related { list-style: none; margin: 0; padding: 0; }
.reader-related li + li, .reader-context-rows > div + div {
 border-top: 1px solid #e2e1d9;
 padding-top: 12px;
 margin-top: 12px;
}
.reader-related-link {
 font: inherit;
 font-size: 14px;
 font-weight: 700;
 color: #294b40;
 line-height: 1.5;
}
button.reader-related-link {
 text-align: left;
 border: 0;
 background: none;
 padding: 0;
 cursor: pointer;
 text-decoration: underline;
 text-underline-offset: 3px;
}
.reader-context-meta {
 display: block;
 margin-top: 4px;
 font-size: 12px;
 color: #56635a;
}
.reader-context-meta a { color: #294b40; }
.reader-related p, .reader-context-rows dd, .reader-diagram {
 margin: 6px 0 0;
 font-size: 13px;
 line-height: 1.65;
 overflow-wrap: anywhere;
}
.reader-context-rows { margin: 0; }
.reader-context-rows dt { font-size: 14px; font-weight: 700; }

.reader-diagram { max-width: 520px; }
.diagram-question { font-weight: 700; margin: 0 0 10px; }
.diagram-options { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.diagram-options li {
 display: grid;
 grid-template-columns: minmax(2.5em, auto) 1fr;
 gap: 1px 8px;
 padding: 5px 8px;
 border: 1px solid #dedfd5;
 border-radius: 6px;
 background: #fffdf8;
}
.diagram-options small { grid-column: 2; color: #324c41; }
.diagram-options .diagram-forgone { border-color: #658070; background: #e4eee5; }
.reader-diagram figcaption { font-weight: 700; }
.diagram-check { margin-top: 10px; }
.diagram-check summary { cursor: pointer; color: #294b40; }
.diagram-check p { margin: 6px 0; }
.diagram-expand {
 font: inherit;
 text-decoration: underline;
 padding: 6px 0;
 background: none;
 color: #294b40;
 border: 0;
 cursor: pointer;
}
.reader-diagram-dialog {
 width: min(520px, calc(100% - 36px));
 max-height: 85vh;
 padding: 22px;
 background: #fffdf8;
 color: #212b27;
 border: 1px solid #d9dfd8;
 border-radius: 14px;
}
.reader-diagram-dialog::backdrop { background: #182b226b; }
.reader-diagram-dialog form { float: right; }
.reader-diagram-dialog .reader-diagram { font-size: 16px; }
.has-reader-asides > .reader { margin-bottom: 24px; }

.reader-panel-diagram + .reader-glossary {
 border-top: 1px solid #e2e1d9;
 margin-top: 18px;
 padding-top: 18px;
}
.reader-panel-diagram h3 { font-size: 15px; margin: 0 0 8px; }
.glossary-filter {
 display: grid;
 gap: 6px;
 margin-bottom: 15px;
 font-size: 13px;
 font-weight: 600;
}
.glossary-filter input {
 width: 100%;
 min-height: 40px;
 padding: 7px 10px;
 font: inherit;
 font-size: 16px;
 background: #fffdf8;
 color: #212b27;
 border: 1px solid #bdc8bf;
 border-radius: 8px;
}
.reader-glossary dt small { color: #54645b; font-weight: 400; }
.reader-panel-dialog {
 position: fixed;
 inset: auto 0 0;
 width: min(620px, 100%);
 max-width: 100%;
 max-height: 82vh;
 max-height: 82dvh;
 margin: 0 auto;
 padding: 0;
 border: 1px solid #d9dfd8;
 border-radius: 18px 18px 0 0;
 background: #fffdf8;
 color: #212b27;
}
.reader-panel-dialog[open] { display: flex; flex-direction: column; }
.reader-panel-dialog::backdrop { background: #182b227d; }
.reader-panel-header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 12px;
 padding: 10px 18px;
 border-bottom: 1px solid #e2e1d9;
 background: #f4f2ea;
}
.reader-panel-header h2 { margin: 0; }
.reader-panel-header button { min-height: 44px; }
.reader-panel-body {
 overflow: auto;
 overscroll-behavior: contain;
 padding: 16px 18px calc(22px + env(safe-area-inset-bottom, 0px));
}
.reader-panel-body .reader-context-rows dd,
.reader-panel-body .reader-related p { font-size: 15px; }
body:has(.reader-panel-dialog[open], .reader-diagram-dialog[open]) { overflow: hidden; }

@media (max-width: 1199px) {
 .reader-aside-inner { display: none; }
 .reader-layout.has-reader-asides { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
 .reader-float-button {
  display: inline-flex;
  position: fixed;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 12;
  align-items: center;
  min-height: 44px;
  padding: 8px 14px;
  border: 1px solid #628778;
  border-radius: 24px;
  background: #294b40;
  color: #fff;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 2px 8px #202b2633;
  cursor: pointer;
 }
 .reader-aside-left .reader-float-button { left: max(12px, env(safe-area-inset-left, 0px)); }
 .reader-aside-right .reader-float-button { right: max(12px, env(safe-area-inset-right, 0px)); }
}

@media (min-width: 1200px) {
 .shell:has(.reader-layout.has-reader-asides) {
  max-width: 1920px;
  padding-inline: clamp(28px, 2.6vw, 56px);
 }
 .reader-layout.has-reader-asides {
  display: grid;
  grid-template-columns: minmax(0, 890px);
  grid-template-areas: "article";
  align-items: start;
  justify-content: center;
  gap: clamp(18px, 1.45vw, 28px);
 }
 .reader-layout.has-reader-asides:has(.reader-aside-left) {
  grid-template-columns: minmax(215px, 380px) minmax(0, 890px);
  grid-template-areas: "related article";
 }
 .reader-layout.has-reader-asides:has(.reader-aside-right) {
  grid-template-columns: minmax(0, 890px) minmax(215px, 380px);
  grid-template-areas: "article context";
 }
 .reader-layout.has-reader-asides:has(.reader-aside-left):has(.reader-aside-right) {
  grid-template-columns: minmax(215px, 1fr) minmax(0, 890px) minmax(215px, 1fr);
  grid-template-areas: "related article context";
 }
 .reader-layout.has-reader-asides > .reader {
  grid-area: article;
  min-width: 0;
  max-width: 890px;
  width: 100%;
 }
 .reader-aside { width: 100%; min-width: 0; margin: 20px 0 0; }
 .reader-aside-left { grid-area: related; }
 .reader-aside-right { grid-area: context; }
 .reader-aside-inner .reader-context-rows dd,
 .reader-aside-inner .reader-related p { font-size: 14px; }
}
@media (min-width: 1200px) and (min-height: 700px) {
 .reader-aside {
  position: sticky;
  top: calc(114px + env(safe-area-inset-top, 0px));
  max-height: calc(100dvh - 130px - env(safe-area-inset-top, 0px));
  overflow: auto;
  scrollbar-width: thin;
 }
}

/* Daily Insight 2.0: trend intelligence, preserving the original editorial palette. */
.nav-new{font-size:10px;font-weight:800;color:#be6347;vertical-align:super;margin-left:2px}
.trend-hero{margin:25px 0 24px;padding:36px 38px;border-radius:18px;background:linear-gradient(115deg,#24483d 5%,#426e61 67%,#7c9e8a);color:#fffdf4;display:flex;justify-content:space-between;align-items:center;gap:28px}
.trend-eyebrow{font-size:11px!important;font-weight:800;letter-spacing:1.6px;color:#e7cba5!important}
.trend-hero h2{font-family:Georgia,'Noto Sans TC',serif;font-size:clamp(27px,3.7vw,45px);font-weight:500;line-height:1.3;margin:10px 0 13px}
.trend-hero p{font-size:15px;line-height:1.8;margin:0;color:#e5eee8;max-width:600px}
.trend-hero-star{color:#e9b886;font-family:'DM Sans',sans-serif}
.trend-hero-meta{min-width:180px;border-left:1px solid #9eb8a9;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.trend-hero-meta span,.trend-hero-meta small{color:#e3ebe1;font-size:12px}
.trend-hero-meta strong{font-size:18px}
.trend-tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:7px;overflow-x:auto;border-bottom:1px solid #dcded6;padding:8px 0 12px;scrollbar-width:thin;background:#f8f6f0;box-shadow:0 8px 14px -14px #24483d;overscroll-behavior-x:contain}
.trend-tab{border:0;border-radius:10px;padding:12px 18px;background:transparent;white-space:nowrap;color:#68756b;font-size:15px;font-family:inherit;font-weight:700;cursor:pointer;min-height:44px}
.trend-tab.active{background:#e7efe7;color:#254c3e}
.trend-dot{display:inline-block;min-width:20px;padding:2px 5px;margin-left:6px;border-radius:12px;background:#b65a43;color:white;font-size:11px}
.trend-overview,.trend-watch,.trend-reports,.trend-network{padding:18px 0 20px}
.trend-section-title{margin:27px 0 17px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.trend-section-title h3{margin:0;font:500 27px Georgia,'Noto Sans TC',serif;color:#26372f}
.trend-section-title span{color:#778479;font-size:13px}
.trend-topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trend-topic-card{display:grid;grid-template-columns:52px 1fr;grid-template-rows:1fr 1fr;align-items:center;column-gap:12px;text-align:left;padding:17px;background:#fffdf8;border:1px solid #e5e5de;border-radius:13px;color:#25362e;min-height:105px;cursor:pointer}
.trend-topic-card:hover,.trend-event-card:hover{border-color:#b9c8bb}
.trend-topic-symbol{grid-row:1/3;width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px}
.trend-topic-card>span:nth-child(2){font-size:15px;font-weight:700}
.trend-topic-card strong{color:#58776a;font-size:16px}.trend-topic-card small{font-weight:400;font-size:12px;color:#8c978d}
.trend-topic-filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 15px;scrollbar-width:thin}
.trend-chip{white-space:nowrap;border:1px solid #d5dcd5;background:#fffdf9;border-radius:99px;padding:9px 15px;min-height:43px;color:#405b4c;font-size:14px;cursor:pointer}
.trend-chip.active{background:#315a4c;color:#fff;border-color:#315a4c}.trend-chip.active span{color:#fff!important}
.trend-event-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.trend-event-card{display:flex;flex-direction:column;background:#fffdf9;border:1px solid #e1e4da;border-radius:14px;padding:23px;min-width:0}
.trend-event-top,.trend-event-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}
.trend-topic-label{font-size:13px;font-weight:800;color:#487263}
.trend-impact{font-size:12px;color:#66786c;border-radius:99px;background:#edf0e8;padding:5px 10px;white-space:nowrap}.trend-impact.mid{background:#f7ebd5;color:#9e6e30}.trend-impact.high{background:#f8e0dc;color:#a94b3d}
.trend-event-card h3{font-size:19px;line-height:1.6;margin:15px 0 9px;overflow-wrap:anywhere}
.trend-event-card h3 button{background:none;border:0;color:#263c30;font:inherit;text-align:left;padding:0;cursor:pointer}
.trend-event-card h3 button:hover{text-decoration:underline;text-underline-offset:4px}
.trend-event-card p{color:#637267;font-size:14px;line-height:1.8;margin:0 0 16px;flex:1}
.trend-event-bottom{border-top:1px solid #ecece4;padding-top:13px;color:#7b897d;font-size:12px;flex-wrap:wrap}
.trend-event-bottom>div,.trend-inline-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.trend-text-btn{background:none;border:0;color:#3d725d;font-size:13px;font-weight:700;cursor:pointer;padding:4px;min-height:30px}
.trend-text-btn:hover{text-decoration:underline}.trend-unread{display:inline-block;color:#aa5544;margin-left:6px}
.trend-event-card.compact{padding:18px}.trend-event-card.compact h3{font-size:16px}

  function eventStatus(e) {

    if ((e.articles||[]).length>1) return '持續發展';

    return elapsed>=0&&elapsed<48*3600000?'新事件':'待確認';

  function relatedKnowledge(e,news) {
    const categories = {technology_ai:['科技與工程','AI與科技'],semiconductors:['科技與工程','AI與科技'],global_finance:['商業與經濟'],business_management:['商業與經濟','心理學與人類行為'],politics_policy:['社會與公共政策','國際與全球趨勢'],consumer_lifestyle:['日常生活與實用技能','醫療與健康']};
    const concepts = [
      ['人工智慧','ai','機器學習','生成式'],['資安','資訊安全','網路安全','身份驗證','身分驗證'],
      ['半導體','晶片','晶圓','積體電路','封裝'],['通膨','物價','消費者物價'],
      ['利率','央行','貨幣政策'],['匯率','外匯','貨幣'],['股票','股市','金融市場','台股'],
      ['供應鏈','產業鏈'],['氣候','環境','永續'],['消費','零售','網購','電子商務'],
      ['政治','選舉','民主','政府'],['法律','法案','法規','政策'],['心理','人力','管理']
    ];
    const related = news.filter(a=>a.kind==='knowledge' && categories[e.primary_topic]?.includes(a.category))
      .map(a=>{
        const eventTitle=e.title.toLowerCase(), articleTitle=a.title.toLowerCase();
        const matches=concepts.filter(group=>group.some(term=>eventTitle.includes(term)) && group.some(term=>articleTitle.includes(term))).length;
        const exact=articleTitle.length>=3 && eventTitle.includes(articleTitle) ? 2 : 0;
        return {a, relevance:matches+exact};
      }).filter(x=>x.relevance>0).sort((a,b)=>b.relevance-a.relevance).slice(0,3).map(x=>x.a);
    return related.length?`<ul class="trend-related">${related.map(a=>`<li><button type="button" data-open="${escapeHtml(a.url)}">${escapeHtml(a.title)}</button><small>${escapeHtml(a.category)}</small></li>`).join('')}</ul>`:'<p>目前知識館藏沒有足夠貼近此事件的專題，因此不提供可能誤導的推薦。可前往「知識」分頁探索完整館藏。</p>';
  }

  function historyDays(period) {
    const source = Array.isArray(history?.days)?history.days:[];
    const limit = new Date();limit.setUTCHours(0,0,0,0);limit.setUTCDate(limit.getUTCDate()-(Number(period)-1));
    return source.filter(x=>Date.parse(x.date+'T00:00:00Z') >= limit.getTime()).sort((a,b)=>a.date.localeCompare(b.date));
  }
  function reportData(period) {
    const days = historyDays(period);
    const sums = Object.fromEntries(topics().map(t=>[t.id,0]));
    days.forEach(day=>topics().forEach(t=>{sums[t.id]+=Number(day.topic_counts?.[t.id]||0)}));
    const total = Object.values(sums).reduce((a,b)=>a+b,0);
    const leading = topics().map(t=>({...t,value:sums[t.id]})).sort((a,b)=>b.value-a.value);
    return {days,total,leading,coverage:days.length,period:Number(period)};
  }

    }
    const r = reportData(preferences.reportPeriod);
    return `Daily Insight 3.0｜${r.period} 天趨勢回顧\n資料涵蓋 ${r.coverage} / ${r.period} 天；每日事件存量，非新增事件件數。\n` + r.leading.map(x=>`${x.label}：${x.value}（各日事件數加總）`).join('\n') + '\n此為規則式分類摘要；原始內容與來源請回網站核對。';

  function network() {

  function switchTab(id, button) {

      const activeLeft = tabs.scrollLeft + active.getBoundingClientRect().left - tabs.getBoundingClientRect().left;

      else if (activeLeft + active.offsetWidth > tabs.scrollLeft + tabs.clientWidth)

    }

  });

})();

const TOPICS = new Map([
 ['醫療與健康', ['健康與醫學常識', '醫療與健康']],
 ['環境與自然', ['環境與自然', '地球科學', '水利與工程']],
 ['科技與工程', ['AI與科技', '通訊與防災', '軟體與開源']],
 ['生活與食品', ['食品與生活', '生活與食品']],
 ['文化與歷史', ['文化與歷史']],
 ['社會與公共政策', ['社會與長照', '居住與公共服務', '國際政治與全球趨勢']]
]);
const KNOWLEDGE_TOPICS = new Map([
 ['日常生活與實用技能', ['食品與生活', '生活與食品']],
 ['商業與經濟', ['經濟與財政']],
 ['心理學與人類行為', []],
 ['人文', []],
 ['藝術與歷史', ['文化與歷史']],
 ['生命科學', []],
 ['邏輯學', []],
 ...[...TOPICS].filter(([topic]) => !['生活與食品', '文化與歷史'].includes(topic))
]);
function topicOf(article) {
 const topics = article.kind === 'knowledge' ? KNOWLEDGE_TOPICS : TOPICS;
 return [...topics].find(([topic, categories]) => topic === article.category || categories.includes(article.category))?.[0] || article.category || '其他';
}
function readingQueue(items,kind,now=Date.now()){
 const unread=homepageArticles(items).filter(a=>(a.kind==='knowledge'?'knowledge':'news')===kind&&!state.read.includes(a.url)&&(kind!=='news'||(Date.parse(a.published_at)>=now-7*86400000&&Date.parse(a.published_at)<=now+10*60000)));
 const day=Math.floor((now+8*3600000)/86400000);
 const ordered=kind==='news'?[...unread].sort((a,b)=>{
   const ageA=(now-Date.parse(a.published_at))/86400000,ageB=(now-Date.parse(b.published_at))/86400000;
   const bandA=ageA<=2?0:1,bandB=ageB<=2?0:1;
   return bandA-bandB || (bandA===0?Number(isMedia(a))-Number(isMedia(b)):0) || Date.parse(b.published_at)-Date.parse(a.published_at);
 }):[...unread].sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh-TW'));
 const groups=new Map();
 for(const a of ordered){const t=topicOf(a);if(!groups.has(t))groups.set(t,[]);groups.get(t).push(a)}
 const topics=[...groups.keys()];
 if(kind==='knowledge'&&topics.length){const shift=day%topics.length;topics.push(...topics.splice(0,shift));for(const group of groups.values()){const n=Math.floor(day/topics.length)%group.length;group.push(...group.splice(0,n))}}
 const queue=[];let remaining=true;
 while(remaining){remaining=false;for(const t of topics){const group=groups.get(t);if(group.length){queue.push(group.shift());remaining=true}}}
 return queue;
}
function dailyKnowledge(items){const article=readingQueue(items,'knowledge')[0];return article?{topic:topicOf(article),article}:null}
function checkedTime(s){const d=new Date(s);return !s||isNaN(d)?'尚未取得':new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short',hour12:false,timeZone:'Asia/Taipei'}).format(d)}
function mergeArticles(curated, live){
 const merged=new Map(curated.map(a=>[a.url,a]));
 for(const a of live){
  const previous=merged.get(a.url);
  if(previous?.kind==='knowledge')continue;
  const next={...previous,...a};
  if(previous?.image_rights==='approved')for(const key of Object.keys(previous).filter(k=>k.startsWith('image_')))next[key]=previous[key];
  if(previous && JSON.stringify(previous.evidence_original)!==JSON.stringify(a.evidence_original)){next.quiz=[];next.quiz_reviewed=false;}
  merged.set(a.url,next);
 }
 return [...merged.values()].filter(a=>safeUrl(a.url)&&a.verification==='publisher_domain_checked');
}
function explore(items) {
 const isKnowledge=state.page==='knowledge', kind=isKnowledge?'knowledge':'news',title=isKnowledge?'知識':'新聞';
 const selected=homepageArticles(items).filter(a=>(a.kind==='knowledge')===isKnowledge).sort((a,b)=>isKnowledge?(Date.parse(b.added_at)||0)-(Date.parse(a.added_at)||0):(Date.parse(b.published_at)||0)-(Date.parse(a.published_at)||0));
 const topics=['全部','有測驗',...new Set([...(isKnowledge?KNOWLEDGE_TOPICS:TOPICS).keys(),...selected.map(topicOf)])];
 const matches=a=>state.filter==='全部'||(state.filter==='有測驗'?quizData(a):topicOf(a)===state.filter);
 const unread=selected.filter(a=>!state.read.includes(a.url));
 const recommended=state.shelf!=='library';
 const queue=readingQueue(items,kind).filter(matches);
 const limit=isKnowledge?9:12;
 const visible=recommended?queue.slice(0,limit):selected.filter(matches);
 const today=isKnowledge&&state.filter==='全部'&&recommended?dailyKnowledge(items):null;
 const bad=Object.entries(state.meta?.sources||{}).filter(([,status])=>status.status==='error');
 const time=isKnowledge?state.meta?.catalog_at:state.meta?.updated_at;
 const emptyMessage = selected.length
   ? '這個範圍目前沒有符合條件的文章，可切換主題或查看全部館藏。'
   : refreshPending ? '正在取得文章，資料載入後會顯示在這裡。'
   : failedData.size ? '目前無法取得此區文章，請按「重新取得內容」重試。'
   : '此區目前沒有可讀文章。';
 const latest=selected.reduce((d,a)=>Date.parse(a.published_at)>(Date.parse(d)||0)?a.published_at:d,null);
 const controls=`<div class="sectionhead"><h2 id="explore-title">${title}</h2><span class="meta">${selected.length} 篇 · 未讀 ${unread.length} 篇</span></div>
 <p class="meta">${isKnowledge?'跨主題開放知識，依閱讀進度補充未讀推薦。':'新聞與可信媒體索引；站內全文及原站閱讀均清楚標示。'} 最近檢查：${esc(checkedTime(time))}（台灣時間）${!isKnowledge?` · 最新發布：${esc(date(latest))}`:''}</p>
 <div class="filters explore-topics" aria-label="${title}主題分類">${topics.map(topic=>`<button class="filter ${state.filter===topic?'selected':''}" data-filter="${esc(topic)}">${esc(topic)}</button>`).join('')}</div>`;
 const content=`<section class="explore-section" aria-labelledby="explore-title">
 <div class="actions reading-options"><button class="btn ${recommended?'primary':''}" data-shelf="recommended">推薦未讀</button><button class="btn ${!recommended?'primary':''}" data-shelf="library">全部館藏（含已讀）</button><button class="btn" data-refresh="1">重新取得內容</button></div>
 <p class="meta">此區已讀 ${selected.length-unread.length} 篇；${!isKnowledge&&recommended?'推薦最近七日新聞；舊聞保留在全部館藏。':''}${recommended?`目前推薦 ${visible.length} 篇，完成一篇即補下一篇。`:'保留全部文章與收藏。'}閱讀進度保存在目前瀏覽器。背景每日 08:00、13:00、18:00 擴充資料，免費排程可能延遲。</p>
 ${state.refreshMessage?`<p role="status" class="meta">${esc(state.refreshMessage)}</p>`:''}
 ${bad.length?`<div class="notice">部分來源暫時無法取得：${bad.map(([key])=>esc(key)).join('、')}。其他來源繼續更新，保留先前可用內容。</div>`:''}
 ${today?`<div class="notice"><strong>今日知識 · ${esc(today.topic)}</strong><p>${esc(today.article.title)}</p><button class="btn primary" data-open="${esc(today.article.url)}">閱讀今日知識</button></div>`:''}
 ${visible.length?`<div class="grid">${visible.map(article).join('')}</div>`:`<div class="empty">${emptyMessage}</div>`}
 </section>`;
 return {controls,content};
}

function sourcesForReader(article) {
 const title = article.title || '';
 const themes = readingThemes.filter(theme => theme.match.test(title));
 const events = reviewedNewsEvents.filter(([,ids]) => ids.includes(article.id));
 const topics = reviewedReadingTopics.filter(([,ids]) => ids.includes(article.id));
 const text = article.kind === 'knowledge' ? glossaryPassages(article).join('\n') : '';
 const related = [];
 for (const candidate of homepageArticles(state.news)) {
  if (candidate.url === article.url || !candidate.title || candidate.title === title) continue;
  const event = events.find(([,ids]) => ids.includes(candidate.id));
  const topic = topics.find(([,ids]) => ids.includes(candidate.id));
  const theme = themes.find(entry => entry.match.test(candidate.title));
  const citedConcept = candidate.kind === 'knowledge' && /^[\p{Script=Han}]{4,14}$/u.test(candidate.title)
   && (findGlossaryWord(title, candidate.title) >= 0
    || text.split(candidate.title).length >= 3);
  if (!event && !topic && !theme && !citedConcept) continue;
  const onSite = candidate.content_scope !== 'media_headline';
  const name = event?.[0] || topic?.[0] || theme?.name;
  const sameEvent = Boolean(event || theme?.event);
  related.push({
   ...candidate, onSite, sameEvent,
   relevance:event ? 4 : topic ? 3 : theme ? 2 : 1,
   reason:sameEvent ? `對照「${name}」的另一則報導。`
    : name ? `從${candidate.kind === 'knowledge' ? '相關概念' : '實際案例'}延伸了解${name}。`
    : `深入閱讀本文提到的「${candidate.title}」。`
  });
 }
 return related.sort((a,b) => Number(state.read.includes(a.url))-Number(state.read.includes(b.url))
   || b.relevance-a.relevance || Number(b.onSite)-Number(a.onSite)
   || (Date.parse(b.published_at)-Date.parse(a.published_at) || 0));
}

function readerLink(link, label, extraClass='') {
 const url = safeUrl(link?.url);
 if (!url) return '';
 return `<a class="${extraClass}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`;
}

function relatedReaderItems(related, editorial) {
 const seen = new Set(), titles = new Set();
 const full = related.filter(item => hasApprovedFullText(item) || isTextEdition(item));
 return [...editorial, ...full, ...related]
  .filter(item => {
   const key = safeUrl(item.url);
   if (!key || seen.has(key) || titles.has(item.title)) return false;
   seen.add(key); titles.add(item.title); return true;
  }).slice(0,3);
}

function relatedReaderContent(related, editorial) {
 const items = relatedReaderItems(related, editorial);
 if (!items.length) return '';
 return `<ul class="reader-related">${items.map(item => `<li>
  ${item.onSite ? `<button class="reader-related-link" type="button" data-open="${esc(item.url)}">${esc(item.title)}</button>`
    : readerLink(item, item.title, 'reader-related-link')}
  <span class="reader-context-meta">${esc(item.source)} · ${esc(item.onSite
    ? isTextEdition(item) ? '站內文字版' : hasApprovedFullText(item) ? '站內全文' : '站內摘要'
    : (item.language ? item.language + ' · ' : '') + '原站閱讀')}</span>
  <p>${esc(item.reason)}</p>
 </li>`).join('')}</ul>`;
}

function relatedNewsContext(article, related) {
 const reported = Date.parse(article.published_at);
 if (!Number.isFinite(reported)) return [];
 const day = date(article.published_at);
 const links = related.filter(item => item.sameEvent && item.kind === 'news'
   && Math.abs(Date.parse(item.published_at)-reported) <= 14*86400000
   && safeUrl(item.url));
 const linksByDate = [...links].sort((a,b) => Date.parse(a.published_at)-Date.parse(b.published_at));
 const previous = linksByDate.find(item => Date.parse(item.published_at) < reported && date(item.published_at) !== day);
 const next = linksByDate.find(item => Date.parse(item.published_at) > reported && date(item.published_at) !== day);
 const sameDay = links.find(item => date(item.published_at) === day && item.source !== article.source)
   || links.find(item => date(item.published_at) === day);
 const row = (label, item) => ({label,date:date(item.published_at),text:item.title,link:item});
 if (!previous && !next && !sameDay) return [];
 return [
  ...(previous ? [row('前情報導',previous)] : []),
  row('本篇報導',article),
  ...(sameDay && (!previous || !next) ? [row('同日相關報導',sameDay)] : []),
  ...(next ? [row('後續報導',next)] : [])
 ];
}

function contextRows(article, rows) {
 return `<dl class="reader-context-rows">${rows.map(row => {
 const published = row.useArticleDate ? date(article.published_at) : row.date;
 return `<div>
  <dt>${esc(row.label)}${published ? `<span class="reader-context-meta">${esc(/^\d{4}-\d{2}-\d{2}$/.test(published) ? date(published) : published)}</span>` : ''}</dt>
  <dd>${esc(row.text)}${published ? `<span class="reader-context-meta">${readerLink(row.link || article,(row.link || article).source)}</span>` : ''}</dd>
 </div>`;
 }).join('')}</dl>`;
}

function knowledgeTextParts(article) {
 return hasChinese(article) && article.translation_status !== 'original_zh_hant'
  ? article.evidence_zh_hant : originalParts(article);
}

function glossaryPassages(article) {
 const parts = knowledgeTextParts(article);
 const end = parts.findIndex(part => /^=+\s*(?:參考|外部連結|延伸閱讀|腳註|註釋|注釋)/.test(part.trim()));
 return end < 0 ? parts : parts.slice(0,end);
}

function findGlossaryWord(text, word) {
 if (!/^[A-Za-z0-9-]+$/.test(word)) return text.indexOf(word);
 const match = text.match(new RegExp('(^|[^A-Za-z0-9])'+word+'(?=$|[^A-Za-z0-9])','i'));
 return match ? match.index + match[1].length : -1;
}

// An article can supply a new term only when its introduction explicitly
// defines that term in a complete, short sentence.
function sourceDefinition(article) {
 const term = (article.title || '').trim();
 if (!/^[\p{Script=Han}A-Za-z][\p{Script=Han}A-Za-z0-9·-]{1,23}$/u.test(term)) return null;
 const lead = knowledgeTextParts(article).find(hasText)?.trim() || '';
 if (!lead.startsWith(term)) return null;
 const firstSentence = lead.match(/^[^。！？；\n]{8,140}。/)?.[0];
 if (!firstSentence) return null;
 const rest = firstSentence.slice(term.length)
  .replace(/^(?:\s*[（(][^）)]{1,100}[）)])*[，,、\s]*/, '')
  .replace(/^(?:(?:亦稱為?|又稱為?|或稱為?|也稱為?|也被稱為|亦作)[^。；]{1,45}?[，,]\s*)/, '');
 if (!/^(?:通常指|泛指|係指|是指|指的是|指|是一種|是一個|是由|是一門|是在|是一項|為一種)/.test(rest)) return null;
 const definition = rest.replace(/\s*\[\d+\]/g, '');
 return {term, definition:term+definition, source:article, fromSource:true};
}

function definitionsInArticle(parts, article) {
 const terms = [];
 // A bilingual name plus explicit definition at the start of a sentence
 // distinguishes a term from ordinary phrases that merely contain 「是」.
 const definition = /^([\p{Script=Han}]{2,16})\s*[（(](?=[^）)]{0,70}[A-Za-z])[^）)]{2,74}[）)]\s*[，,]?\s*((?:係指|是指|指的是|指|是一種|是一個|是一門)[^。！？；]{4,110}。)$/u;
 for (const paragraph of parts) {
  for (const sentence of paragraph.match(/[^。！？\n]+。/g) || []) {
   const match = sentence.trim().match(definition);
   if (match) terms.push({term:match[1], definition:match[1]+match[2], source:article});
  }
 }
 return terms;
}

function readerGlossary(article, supplement) {
 const parts = glossaryPassages(article);
 const text = parts.join('\n');
 const title = article.title || '';
 const position = term => findGlossaryWord(text, term);
 const matches = new Map();
 const covered = new Set();
 function add(term, definition, source, aliases=[], fromSource=false) {
  if (covered.has(term)) return;
  const words = [term, ...aliases];
  const found = words.map(word => ({word, index:position(word)})).filter(item => item.index >= 0)
   .sort((a,b) => a.index-b.index || b.word.length-a.word.length);
  if (!found.length) return;
  matches.set(term,{term,definition,source,fromSource,index:found[0].index,
   variant:found.some(item => item.word === term) ? null : found[0].word});
  words.forEach(word => covered.add(word));
 }
 for (const [term,definition] of supplement.terms || []) add(term,definition,supplement.source);
 for (const group of glossaryGroups) {
  if (!group.scope.test([title,article.category,topicOf(article)].join(' '))) continue;
  for (const [term, definition, ...aliases] of group.terms) add(term,definition,group.source,aliases);
 }
 for (const def of definitionsInArticle(parts,article)) {
  add(def.term,def.definition,def.source,[],true);
 }
 for (const entry of [article,...state.news.filter(candidate => candidate.url !== article.url
   && candidate.kind === 'knowledge' && topicOf(candidate) === topicOf(article)
   && (hasApprovedFullText(candidate) || isTextEdition(candidate)) && hasChinese(candidate))]) {
  const def = sourceDefinition(entry);
  if (def) add(def.term,def.definition,def.source,[],true);
 }
 return [...matches.values()].sort((a,b) => a.index-b.index || b.term.length-a.term.length);
}

function glossaryContent(terms) {
 if (!terms.length) return '';
 return `<section class="reader-glossary" aria-label="術語解釋">
  ${terms.length > 1 ? `<label class="glossary-filter">搜尋 ${terms.length} 個術語<input type="search" data-glossary-search placeholder="輸入關鍵字"></label>` : ''}
  <dl class="reader-context-rows">${terms.map(item => `<div data-glossary-row>
   <dt>${esc(item.term)}${item.variant ? ` <small>（文中：${esc(item.variant)}）</small>` : ''}</dt>
   <dd>${esc(item.definition)}${item.source ? `<span class="reader-context-meta">${readerLink(item.source,item.fromSource?'定義來源｜'+item.source.title:item.source.source)}</span>` : ''}</dd>
  </div>`).join('')}</dl>
  <p class="glossary-no-results" hidden>找不到符合的術語。</p>
 </section>`;
}

function filterReaderGlossary(input) {
 const glossary = input.closest('.reader-glossary');
 const query = input.value.trim().normalize('NFKC').toLocaleLowerCase('zh-TW');
 const rows = [...glossary.querySelectorAll('[data-glossary-row]')];
 for (const row of rows) row.hidden = !row.textContent.normalize('NFKC').toLocaleLowerCase('zh-TW').includes(query);
 glossary.querySelector('.glossary-no-results').hidden = rows.some(row => !row.hidden);
}

function readerAside(title, content, side) {
 if (!content) return '';
 return `<aside class="reader-aside reader-aside-${side}" aria-label="${esc(title)}">
  <button class="reader-float-button" type="button" data-reader-panel="${side}" aria-haspopup="dialog">${esc(title)}</button>
  <div class="reader-aside-inner"><h2>${esc(title)}</h2><div class="reader-aside-content">${content}</div></div>
 </aside>`;
}

function readerLayout(article) {
 const supplement = readerSupplements[article.id] || {};
 const related = sourcesForReader(article);
 const left = readerAside('延伸閱讀',relatedReaderContent(related,supplement.related || []),'left');
 let right = '';
 let diagramDialog = '';
 if (article.kind === 'knowledge') {
  const terms = glossaryContent(readerGlossary(article,supplement));
  let diagram = '';
  if (supplement.diagram === 'opportunity-cost') {
   diagram = `<section class="reader-panel-diagram"><h3>圖解 · 機會成本</h3>${reviewedCostDiagram()}</section>`;
   diagramDialog = `<dialog class="reader-diagram-dialog" aria-labelledby="diagram-title">
    <form method="dialog"><button class="btn" type="submit">關閉</button></form>
    <h2 id="diagram-title">機會成本</h2>${reviewedCostDiagram(false)}
   </dialog>`;
  }
  right = readerAside(terms?'術語解釋':'圖解',diagram+terms,'right');
 } else {
  const rows = supplement.context || relatedNewsContext(article,related);
  if (rows.length) right = readerAside('新聞脈絡',contextRows(article,rows),'right');
 }
 const panelDialog = left || right ? `<dialog class="reader-panel-dialog" id="reader-panel-dialog" aria-labelledby="reader-panel-title">
  <header class="reader-panel-header">
   <h2 id="reader-panel-title"></h2>
   <form method="dialog"><button class="btn" value="close" autofocus>關閉</button></form>
  </header>
  <div class="reader-panel-body"></div>
 </dialog>` : '';
 return `<div class="reader-layout${left || right ? ' has-reader-asides' : ''}">
  ${reader(article)}${right}${left}${panelDialog}${diagramDialog}
 </div>`;
}

function openReaderPanel(trigger) {
 const dialog = document.querySelector('.reader-panel-dialog');
 const aside = trigger.closest('.reader-aside');
 if (!dialog || !aside || dialog.open) return;
 dialog.querySelector('h2').textContent = aside.getAttribute('aria-label');
 const content = aside.querySelector('.reader-aside-content');
 const clone = content.cloneNode(true);
 const search = clone.querySelector('[data-glossary-search]');
 if (search) {
  search.value = '';
  filterReaderGlossary(search);
 }
 const body = dialog.querySelector('.reader-panel-body');
 body.replaceChildren(clone);
 dialog.showModal();
 body.scrollTop = 0;
}

document.addEventListener('input',event => {
 if (event.target.matches('[data-glossary-search]')) filterReaderGlossary(event.target);
});

else main.innerHTML=`<div class="sectionhead"><h2>我們如何對待資訊</h2></div><div class="notice">來源包括政府機關、具編輯責任的可信媒體，以及開放授權百科。Yahoo 為新聞聚合平台，原始媒體及全文以原站標示為準；媒體報導不等於研究共識，百科也可能有錯。以不同來源互相核對。經核對授權的繁中內容可完整閱讀，並附原始發布頁與授權連結。官方知識專題經閱讀審核；百科文字版會檢查正文長度與段落，排除消歧義與公式依賴頁面，這項自動檢查不等於人工事實審查，原站附件或圖表只能作為補充。文章須先交代核心概念，再按讀者能理解的順序說明。表格資料須保留欄位與數值的對應，純欄位清單或發布規格不作為知識文章。網域核對不能證明所有主張正確；中文來源優先；英文資料未完成中文翻譯時不作一般推薦，翻譯可能因模型或資源限制失敗，不能保證完全準確。無摘要或無翻譯時明確標示，不捏造。完整轉載須確認授權。</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.refresh){refreshContent(true)}else if(b.dataset.shelf){state.shelf=b.dataset.shelf;render()}else if(b.dataset.next){const a=state.news.find(x=>x.url===b.dataset.next);if(!state.read.includes(b.dataset.next))state.read.push(b.dataset.next);persist();const next=readingQueue(state.news,a?.kind==='knowledge'?'knowledge':'news')[0];state.selected=next?.url||null;state.mode='zh';render();window.scrollTo(0,0)}else if(b.dataset.challenges){state.page='knowledge';state.filter='有測驗';state.selected=null;render()}else if(b.dataset.page){state.page=b.dataset.page;state.filter='全部';state.selected=null;render()}else if(b.dataset.filter){state.filter=b.dataset.filter;render()}else if(b.dataset.readerPanel){openReaderPanel(b)}else if(b.hasAttribute('data-diagram-expand')){document.querySelector('.reader-diagram-dialog')?.showModal?.()}else if(b.dataset.open){if(!state.selected)explorationScroll=window.scrollY;state.selected=b.dataset.open;state.mode='zh';render();const paragraph=Number(b.dataset.reviewParagraph);const target=b.hasAttribute('data-review-quiz')?document.getElementById('knowledge-quiz'):Number.isInteger(paragraph)&&paragraph>0?document.getElementById('article-paragraph-'+paragraph):null;if(target){target.scrollIntoView({block:'center'});target.focus?.({preventScroll:true})}else window.scrollTo(0,0)}else if(b.dataset.back){state.selected=null;render();window.scrollTo(0,explorationScroll)}else if(b.dataset.mode){state.mode=b.dataset.mode;render()}else if(b.dataset.save){state.saved=state.saved.includes(b.dataset.save)?state.saved.filter(x=>x!==b.dataset.save):[...state.saved,b.dataset.save];persist();render()}else if(b.dataset.quizReset){delete state.quizResults[b.dataset.quizReset];persist();render()}

async function readNews(url) {
 const controller = new AbortController();
 const deadline = setTimeout(() => controller.abort(), 12000);
 try {
  const response = await fetch(url, {cache:'no-store', signal:controller.signal});
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const data = await response.json();
  if (!Array.isArray(data?.items)) throw new Error('invalid article data');
  const items = data.items.filter(item => item && typeof item.url === 'string');
  if (data.items.length && !items.length) throw new Error('invalid articles');
  return {...data, items};
 } finally {
  clearTimeout(deadline);
 }
}

async function readArticleSource(source) {
 try {
  return await readNews('./data/' + source.file);
 } catch (error) {
  if (!source.backup) throw error;
  return readNews(RAW_DATA + source.file);
 }
}

function applyArticleData() {
 const daily = articleData.get('daily');
 const taiwan = articleData.get('taiwan');
 const catalog = articleData.get('catalog');
 const sources = {...daily?.sources, ...catalog?.sources};
 for (const source of DATA_SOURCES) {
  if (failedData.has(source.key)) sources[source.label] = {status:'error'};
 }
 const dates = [daily?.updated_at, catalog?.updated_at].filter(Boolean).sort();
 state.meta = {updated_at:dates.at(-1), catalog_at:catalog?.updated_at, sources};
 state.news = mergeArticles(taiwan?.items || [], [
  ...(daily?.items || []), ...(catalog?.items || [])
 ]);
}

async function refreshContent(manual=false) {
 if (refreshPending) return;
 refreshPending = true;
 const previous = new Set(state.news.map(article => article.url));
 state.refreshMessage = manual ? '正在取得最新新聞與知識…' : '';
 try {
  if (!state.selected) render();
  await Promise.allSettled(DATA_SOURCES.map(async source => {
   try {
    const data = await readArticleSource(source);
    articleData.set(source.key, data);
    failedData.delete(source.key);
   } catch {
    failedData.add(source.key);
   }
   applyArticleData();
   if (!state.selected) render();
  }));
  if (manual) {
   const added = state.news.filter(article => !previous.has(article.url)).length;
   if (added) state.refreshMessage = `已取得 ${added} 篇新增內容。`;
   else if (failedData.size === DATA_SOURCES.length) state.refreshMessage = '文章更新失敗，請稍後重試。';
   else state.refreshMessage = '已取得目前可用內容。';
  }
 } finally {
  lastRefresh = Date.now();
  refreshPending = false;
  if (!state.selected) render();
 }
}
refreshContent();
readerDesktop?.addEventListener('change',event => {
 if (event.matches) document.querySelector('.reader-panel-dialog[open]')?.close();
});
setInterval(()=>{if(!document.hidden&&!state.selected)refreshContent()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRefresh>60000)refreshContent()});
window.addEventListener('online',()=>refreshContent());
