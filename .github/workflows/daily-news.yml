name: Update primary-source news
on:
  schedule:
    - cron: '15 0 * * *' # 08:15 Asia/Taipei; GitHub may delay scheduled jobs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update publisher evidence and optional translation
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
        run: python scripts/update_news.py
      - name: Commit data only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then git commit -m 'Update publisher evidence and translation'; git push; fi
