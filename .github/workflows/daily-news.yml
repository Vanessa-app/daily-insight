name: Update primary-source news
on:
  schedule:
    - cron: '0 0,5,10 * * *' # 08:00, 13:00, 18:00 Asia/Taipei; GitHub may delay scheduled jobs
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-news.yml'
      - 'scripts/update_news.py'
      - 'sources.json'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translation and feed dependencies
        run: python -m pip install -r requirements.txt
      - name: Update publisher evidence and offline translation
        run: python scripts/update_news.py
      - name: Commit data only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then git commit -m 'Update publisher evidence and translation'; git push; fi
